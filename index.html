<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="game.js"></script>
  </head>
  <body>
    <div class="panel">
      <div class="stat">
        <span class="stat-label">Difficulty</span>
        <span class="stat-value" id="difficulty">Easy</span>
      </div>
      <div class="stat">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score">0/43</span>
      </div>
      <div class="stat">
        <span class="stat-label">Mistakes</span>
        <span class="stat-value" id="errors">0</span>
      </div>
    </div>

    <div id="board"></div>

    <div id="tools">
      <button id="undo">
        <span class="tool-label">Undo</span><span class="tool-icon">↶</span>
      </button>
      <button id="erase">
        <span class="tool-label">Erase</span><span class="tool-icon">⌫</span>
      </button>
      <button id="notes">
        <span class="tool-label">Notes</span><span class="tool-icon">✎</span>
      </button>
      <button id="help">
        <span class="tool-label">Help</span><span class="tool-icon">💡</span>
      </button>
    </div>

    <div id="numbers"></div>
  </body>
</html>
