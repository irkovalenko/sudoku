<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku</title>
    <link rel="icon" type="image/x-icon" href="media/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <div class="panel">
      <div class="stat dropdown">
        <span class="stat-label">Difficulty</span>
        <button
          class="stat-value dropdown-toggle"
          id="difficulty"
          aria-haspopup="listbox"
          aria-expanded="false"
        ></button>
        <ul
          class="dropdown-menu"
          id="difficulty-menu"
          role="listbox"
          hidden
        ></ul>
      </div>
      <div class="stat">
        <span class="stat-label">Score</span>
        <div class="stat-row">
          <span class="stat-value" id="score">0</span>
          <img src="media/images/coconut.png" alt="Coconut" />
        </div>
      </div>
      <div class="stat">
        <span class="stat-label">Mistakes</span>
        <div class="stat-row">
          <span class="stat-value" id="errors">0</span>
          <img src="media/images/seagull.png" alt="Seagull" />
        </div>
      </div>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="modal-box" role="dialog" aria-modal="true">
        <button class="modal-close" aria-label="Close">×</button>
        <div id="teasing-message" class="modal-content"></div>
      </div>
    </div>

    <div id="board"></div>

    <div id="tools">
      <button id="undo" data-tooltip="undo">
        <img src="media/images/tools/undo.png" class="tool-icon" />
      </button>
      <button id="erase" data-tooltip="erase">
        <img src="media/images/tools/erase.png" class="tool-icon" />
      </button>
      <button id="help" data-tooltip="help">
        <img src="media/images/tools/help.png" class="tool-icon" />
      </button>
      <button id="silent" data-tooltip="silent mode">
        <span class="tool-emoji">🔊</span>
      </button>
    </div>

    <div id="progress">
      <div class="wave-box">
        <svg
          class="wave wave-track"
          viewBox="-4 0 408 24"
          preserveAspectRatio="none"
        >
          <path
            d="M0 12 Q12.5 0 25 12 T50 12 T75 12 T100 12 T125 12 T150 12 T175 12 T200 12 T225 12 T250 12 T275 12 T300 12 T325 12 T350 12 T375 12 T400 12"
          />
        </svg>
        <svg
          class="wave wave-fill"
          id="progress-fill"
          viewBox="-4 0 408 24"
          preserveAspectRatio="none"
        >
          <path
            d="M0 12 Q12.5 0 25 12 T50 12 T75 12 T100 12 T125 12 T150 12 T175 12 T200 12 T225 12 T250 12 T275 12 T300 12 T325 12 T350 12 T375 12 T400 12"
          />
        </svg>
      </div>
      <div class="milestones">
        <span class="milestone" data-at="25" style="left: 25%">🐚</span>
        <span class="milestone" data-at="50" style="left: 50%">🐟</span>
        <span class="milestone" data-at="75" style="left: 75%">🦈</span>
        <span class="milestone" data-at="100" style="left: 100%">🐀</span>
      </div>
    </div>

    <div id="numbers"></div>
  </body>
</html>
